<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner | Make Itinerary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/default.css">
    <script src="../js/default.mjs" type="module" defer></script>
</head>

<body>
    <header>

    </header>
    <main>
        <div class="content-box">
            <h1>Construct Your Itinerary</h1>
        </div>
        <div class="content-box itinerary-box">
            <div class="itinerary-start">HH:MM</div>
            <div class="itinerary-line">
                <span class="itinerary-section i-empty">a</span>
                <span class="itinerary-section i-break">a</span>
                <span class="itinerary-section i-filled">a</span>
                <span class="itinerary-section i-remainder">a</span>
                <span class="itinerary-section i-excess">a</span>
            </div>
            <div class="itinerary-end">HH:MM</div>
        </div>

        <div class="content-box media-list">
            <h2 class="content-box-title">Wishlist</h2>
            <h3 class="content-box-subtitle">Add media to your itinerary</h3>
            <div class="media-nav-l">&lt;</div>

            <div class="media-nav-r">&gt;</div>
            <div class="media-boxes">
                <div class="media-box">
                    <div class="wishlist-modify add">+</div>
                    <h1 class="media-title">Box 1</h1>
                    <div class="itinerary-modify remove">-</div>
                    <img src="../images/sample.jpg" alt="Sample Image" class="media-image">
                    <p class="media-description">This is a sample boilerplate HTML page.</p>
                    <p class="media-duration">HH:MM:SS</p>
                </div>
                <div class="media-box media-box-placeholder"><span>placeholder</span></div>
                <div class="media-box">
                    <div class="wishlist-modify add">+</div>
                    <h1 class="media-title">Box 1</h1>
                    <div class="itinerary-modify remove">-</div>
                    <img src="../images/sample.jpg" alt="Sample Image" class="media-image">
                    <p class="media-description">This is a sample boilerplate HTML page.</p>
                    <p class="media-duration">HH:MM:SS</p>
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>

</html>
